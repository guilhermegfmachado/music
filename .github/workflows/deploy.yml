name: Deploy Svara to GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/build-scale-atlas-w3JAY"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scale-atlas/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: scale-atlas

      - name: Build
        run: npm run build
        working-directory: scale-atlas

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: scale-atlas/dist
